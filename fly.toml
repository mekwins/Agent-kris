# fly.io config for the Brain MCP server.
# Rename `app` to something unique, then: fly launch --no-deploy (to register),
# fly volumes create, fly secrets set, fly deploy.

app = "kris-brain-mcp"
primary_region = "ord"   # Chicago — closest to Michigan/US-Central

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  VAULTS_ROOT = "/data/vaults"
  WIKIS_CONFIG = "/app/wikis.toml"
  DEFAULT_WIKI = "work"
  # Vault data source of truth (cloned onto the volume at boot). No scheme/token
  # here — the entrypoint prepends https + the GITHUB_TOKEN secret.
  VAULTS_REPO = "github.com/mekwins/brain-vaults.git"

# Personal brain: one machine, one volume. All vaults and their vector stores
# live on the volume, which is bound to a single machine — do NOT scale to
# multiple machines without moving to shared storage.
[[mounts]]
  source = "brain_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  # SSE is a long-lived stream; keep concurrency generous for a single user.
  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  size = "shared-cpu-1x"
  # Bumped from 512mb -> 1024mb after a real production OOM: the 'work'
  # vault's .vectors.json grew to ~92MB on disk (2930 chunks x 1536-dim
  # embeddings, stored as plaintext JSON floats). _load() fully parses this
  # into Python dicts + numpy arrays for every brain_search_tool call,
  # ballooning well past 512MB and triggering a kernel OOM-kill of the
  # whole VM (not just the process) mid-search. 1024mb gives headroom for
  # the vault to keep growing before this becomes an issue again; the
  # long-term fix is moving off an all-in-RAM JSON store (see brain_mcp
  # technical analysis doc) to something that doesn't require loading the
  # entire index per search.
  memory = "1024mb"
