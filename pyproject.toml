[project]
name = "brain-mcp-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # MCP server
    "mcp[cli]>=1.9.0",
    # Agent SDK
    "anthropic>=0.40.0",
    # Trigger / webhook server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "twilio>=9.0.0",
    # Vault + embeddings
    "python-dotenv>=1.0.0",
    "python-frontmatter>=1.1.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    # Web clipping
    "trafilatura>=1.12.0",
    # Connectors
    "aioimaplib>=2.0.0",
]

[project.scripts]
brain-mcp = "src.server:main"
brain-index = "scripts.index_vault:main"
brain-trigger = "trigger.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
