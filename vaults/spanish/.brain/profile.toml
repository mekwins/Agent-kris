description = "Spanish language learning: lessons, homework, grammar references, vocabulary, and self-assessments. Lightweight and progress-oriented."
domains = ["vocab", "grammar", "lesson", "assessment"]

[types.vocab]
frontmatter = ["title", "tags"]
hint = "Group vocabulary by topic. Keep word, translation, and an example sentence. Never merge distinct words onto one page arbitrarily."

[types.lesson]
frontmatter = ["title", "date", "topics", "tags"]
hint = "One page per lesson or homework set; capture date, topics covered, and what was practiced."

[types.grammar]
frontmatter = ["title", "tags"]
hint = "Reference pages for grammar rules (verb conjugations, tenses). Link from lessons that use them."

[types.assessment]
frontmatter = ["title", "date", "level", "tags"]
hint = "Level assessments and error patterns. Track progress over time; link to the grammar/vocab that needs work."
