description = "Work knowledge base: Nexteer, enterprise architecture, AI strategy, active projects, and the people involved. Project- and people-heavy — optimized for assembling context for work tasks."
domains = ["projects", "people", "concepts", "areas", "brainstorm"]

[types.person]
frontmatter = ["title", "org", "role", "projects", "tags"]
hint = "One page per named colleague/stakeholder. Link them to the projects they touch and capture their positions/decisions."

[types.project]
frontmatter = ["title", "status", "stakeholders", "goals", "tags"]
hint = "One page per project with goals, status and the people involved. Cross-link related projects and concepts for task context."

[types.concept]
frontmatter = ["title", "tags"]
hint = "Settled, reusable knowledge (MCP, agents, architecture patterns). Keep domain-agnostic and link to the projects that use it."

[types.task]
frontmatter = ["title", "status", "assignee", "due", "related", "tags"]
hint = "Actionable to-do. status: open|done. Resolve the assignee to an existing [[person]] or create a stub, link the related [[project]], and back-link the task from the person's Assigned Tasks section."
